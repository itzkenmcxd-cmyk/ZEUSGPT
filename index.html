
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUSGPT ULTRA</title>
<style>
*{box-sizing:border-box}
:root{--bg:#080b16;--panel:#101629;--line:#26314d;--text:#f3f5ff;--muted:#929bb5;--purple:#8058ff;--blue:#328cff}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100vh;overflow:hidden}
button,textarea{font:inherit}
.app{display:flex;height:100vh}
.sidebar{width:270px;background:#0c1120;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:23px;font-weight:900;background:linear-gradient(90deg,#a58aff,#48b8ff);background-clip:text;color:transparent}
.new{background:linear-gradient(100deg,var(--purple),var(--blue));border:0;color:white;padding:13px;border-radius:12px;cursor:pointer;font-weight:bold}
.side-title{font-size:12px;color:var(--muted);margin-top:12px}
.history{overflow:auto;flex:1}
.chat-item{padding:12px;border-radius:10px;color:#c9d1e8;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.chat-item.active,.chat-item:hover{background:#1a2440}
.side-bottom{font-size:12px;color:var(--muted);line-height:1.6}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.status{font-size:12px;color:#6ce3ae}
.messages{flex:1;overflow-y:auto;padding:25px max(18px,calc((100% - 850px)/2))}
.welcome{text-align:center;margin:12vh auto 30px;max-width:600px}
.symbol{font-size:55px}
.welcome h1{font-size:35px;margin:15px 0 8px;background:linear-gradient(90deg,#a58aff,#48b8ff);background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}
.suggestions button{background:#131c32;border:1px solid var(--line);color:#dce3ff;padding:10px 13px;border-radius:12px;cursor:pointer}
.message{display:flex;gap:12px;margin:22px 0;align-items:flex-start}
.avatar{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:#25204a}
.message.user .avatar{background:#17345b}
.bubble{max-width:100%;min-width:0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user .bubble{background:#151f36;border:1px solid #293a5c;padding:12px 15px;border-radius:14px}
.message img{display:block;max-width:min(320px,100%);max-height:260px;object-fit:contain;border-radius:12px;margin-bottom:10px}
.copy{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;margin-top:8px}
.composer-area{padding:12px 18px 18px}
.composer{max-width:850px;margin:auto;background:#111a2d;border:1px solid #34415f;border-radius:18px;padding:12px}
.preview{display:none;padding:4px 5px 12px}
.preview img{width:85px;height:85px;object-fit:cover;border-radius:10px}
.remove{border:0;background:#452337;color:white;border-radius:8px;padding:6px 10px;cursor:pointer;margin-left:8px}
textarea{width:100%;resize:none;max-height:150px;min-height:48px;background:transparent;border:0;outline:0;color:white;padding:10px}
.tools{display:flex;align-items:center;gap:9px}
.tool{border:1px solid var(--line);background:#18233b;color:#dce5ff;border-radius:10px;padding:10px 12px;cursor:pointer}
.send{margin-left:auto;background:linear-gradient(100deg,var(--purple),var(--blue));border:0;color:white;padding:11px 17px;border-radius:11px;cursor:pointer;font-weight:bold}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{text-align:center;color:#78839e;font-size:11px;margin-top:10px}
.menu{display:none;background:none;border:0;color:white;font-size:22px}
@media(max-width:700px){
.sidebar{position:fixed;z-index:5;left:-280px;top:0;bottom:0;transition:.2s}
.sidebar.open{left:0}
.menu{display:block}
.messages{padding:18px 14px}
.welcome{margin-top:10vh}
.welcome h1{font-size:29px}
.top{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="logo">⚡ ZEUSGPT</div>
<button class="new" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
<div class="side-title">LỊCH SỬ TRÒ CHUYỆN</div>
<div class="history" id="history"></div>
<div class="side-bottom">ZEUSGPT ULTRA<br>AI Assistant • Shared Worker</div>
</aside>

<main class="main">
<header class="top">
<div style="display:flex;align-items:center;gap:12px">
<button class="menu" onclick="toggleMenu()">☰</button>
<strong>ZEUSGPT <span style="color:#9b82ff">ULTRA</span></strong>
</div>
<span class="status">● AI Assistant</span>
</header>

<section class="messages" id="messages">
<div class="welcome">
<div class="symbol">⚡</div>
<h1>ZEUSGPT ULTRA</h1>
<p>Xin chào! Tôi có thể giúp bạn học tập, viết code, giải đáp câu hỏi và phân tích hình ảnh.</p>
<div class="suggestions">
<button onclick="quick('Giới thiệu về bạn đi')">Giới thiệu bản thân</button>
<button onclick="quick('Giúp tôi học tập')">Học tập</button>
<button onclick="quick('Viết cho tôi một trang web HTML')">Viết code</button>
</div>
</div>
</section>

<footer class="composer-area">
<div class="composer">
<div class="preview" id="preview">
<img id="previewImg" alt="Ảnh xem trước">
<button class="remove" onclick="removeImage()">Xóa ảnh</button>
</div>
<textarea id="prompt" placeholder="Nhắn tin cho ZEUSGPT..." rows="1"></textarea>
<div class="tools">
<button class="tool" onclick="document.getElementById('file').click()">＋ Ảnh</button>
<input id="file" type="file" accept="image/*" hidden onchange="chooseImage(event)">
<button class="tool" onclick="clearInput()">Xóa</button>
<button class="send" id="send" onclick="sendMessage()">Gửi ➤</button>
</div>
</div>
<div class="note">ZEUSGPT có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</div>
</footer>
</main>
</div>

<script>
const API_URL="https://khanggpt.itzkenmcxd.workers.dev";
const APP_NAME="ZEUSGPT";

let chats=[];
let currentChat=null;
let selectedImage=null;
let busy=false;

const messagesEl=document.getElementById("messages");
const promptEl=document.getElementById("prompt");

function createChat(){
 return {id:Date.now()+Math.random(),title:"Cuộc trò chuyện mới",messages:[]};
}

function newChat(){
 currentChat=createChat();
 chats.unshift(currentChat);
 selectedImage=null;
 updatePreview();
 promptEl.value="";
 render();
 promptEl.focus();
 document.getElementById("sidebar").classList.remove("open");
}

function selectChat(id){
 currentChat=chats.find(c=>c.id===id);
 render();
 document.getElementById("sidebar").classList.remove("open");
}

function renderHistory(){
 const el=document.getElementById("history");
 el.innerHTML="";
 chats.forEach(chat=>{
  const item=document.createElement("div");
  item.className="chat-item"+(currentChat&&currentChat.id===chat.id?" active":"");
  item.textContent=chat.title;
  item.onclick=()=>selectChat(chat.id);
  el.appendChild(item);
 });
}

function render(){
 renderHistory();
 messagesEl.innerHTML="";
 if(!currentChat||currentChat.messages.length===0){
  messagesEl.innerHTML=`
   <div class="welcome">
    <div class="symbol">⚡</div>
    <h1>ZEUSGPT ULTRA</h1>
    <p>Xin chào! Tôi có thể giúp bạn học tập, viết code, giải đáp câu hỏi và phân tích hình ảnh.</p>
    <div class="suggestions">
     <button onclick="quick('Giới thiệu về bạn đi')">Giới thiệu bản thân</button>
     <button onclick="quick('Giúp tôi học tập')">Học tập</button>
     <button onclick="quick('Viết cho tôi một trang web HTML')">Viết code</button>
    </div>
   </div>`;
  return;
 }
 currentChat.messages.forEach(m=>addMessage(m.role,m.content,m.image,false));
 messagesEl.scrollTop=messagesEl.scrollHeight;
}

function addMessage(role,content,image=null,scroll=true){
 const row=document.createElement("div");
 row.className="message "+role;
 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="user"?"👤":"⚡";
 const body=document.createElement("div");
 body.style.minWidth="0";
 body.style.flex="1";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 if(image){
  const img=document.createElement("img");
  img.src=image;
  img.alt="Ảnh đính kèm";
  bubble.appendChild(img);
 }
 const text=document.createElement("div");
 text.textContent=content;
 bubble.appendChild(text);
 body.appendChild(bubble);
 if(role==="assistant"&&content){
  const copy=document.createElement("button");
  copy.className="copy";
  copy.textContent="Sao chép";
  copy.onclick=()=>navigator.clipboard.writeText(content).then(()=>copy.textContent="Đã sao chép");
  body.appendChild(copy);
 }
 row.append(avatar,body);
 messagesEl.appendChild(row);
 if(scroll)messagesEl.scrollTop=messagesEl.scrollHeight;
 return row;
}

function chooseImage(event){
 const file=event.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  alert("Vui lòng chọn ảnh.");
  return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const canvas=document.createElement("canvas");
   const maxSide=768;
   const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   selectedImage=canvas.toDataURL("image/jpeg",0.65);
   updatePreview();
  };
  img.onerror=()=>alert("Không thể đọc ảnh này.");
  img.src=reader.result;
 };
 reader.onerror=()=>alert("Không đọc được file ảnh.");
 reader.readAsDataURL(file);
}

function updatePreview(){
 const box=document.getElementById("preview");
 if(selectedImage){
  box.style.display="block";
  document.getElementById("previewImg").src=selectedImage;
 }else{
  box.style.display="none";
  document.getElementById("previewImg").removeAttribute("src");
 }
}

function removeImage(){
 selectedImage=null;
 document.getElementById("file").value="";
 updatePreview();
}

function clearInput(){
 promptEl.value="";
 removeImage();
}

function quick(text){
 promptEl.value=text;
 sendMessage();
}

async function sendMessage(){
 const text=promptEl.value.trim();
 if(busy)return;
 if(!text&&!selectedImage){promptEl.focus();return;}

 if(!currentChat){
  currentChat=createChat();
  chats.unshift(currentChat);
 }

 const image=selectedImage;
 const content=text||(image?"Hãy phân tích hình ảnh này.":"");
 currentChat.messages.push({role:"user",content,image});
 if(currentChat.title==="Cuộc trò chuyện mới"){
  currentChat.title=content.slice(0,32)||"Phân tích hình ảnh";
 }

 promptEl.value="";
 removeImage();
 render();

 busy=true;
 document.getElementById("send").disabled=true;
 const loading=addMessage("assistant","Đang suy nghĩ...");

 try{
  const history=currentChat.messages.slice(-12).map(m=>({
   role:m.role,
   content:m.content
  }));

  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    app:APP_NAME,
    messages:history,
    ...(image?{image}: {})
   })
  });

  let data;
  try{data=await response.json();}
  catch{throw new Error("Worker không trả về JSON hợp lệ.");}

  if(!response.ok||!data.reply){
   throw new Error(
    (data.error||"AI không trả lời.")+
    (data.details?"\nChi tiết: "+data.details:"")
   );
  }

  loading.querySelector(".bubble").textContent=data.reply;
  const copy=document.createElement("button");
  copy.className="copy";
  copy.textContent="Sao chép";
  copy.onclick=()=>navigator.clipboard.writeText(data.reply).then(()=>copy.textContent="Đã sao chép");
  loading.querySelector("div:nth-child(2)").appendChild(copy);

  currentChat.messages.push({role:"assistant",content:data.reply});

 }catch(error){
  const message="⚠️ "+(error.message||"Không thể kết nối AI.");
  loading.querySelector(".bubble").textContent=message;
  currentChat.messages.push({role:"assistant",content:message});
 }finally{
  busy=false;
  document.getElementById("send").disabled=false;
  renderHistory();
  messagesEl.scrollTop=messagesEl.scrollHeight;
 }
}

function toggleMenu(){
 document.getElementById("sidebar").classList.toggle("open");
}

promptEl.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>
</body>
</html>
