<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170b35">
<title>ZEUSGPT AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--purple:#a78bfa;--pink:#ec4899}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Arial,sans-serif;
 background:linear-gradient(-45deg,#10051f,#251052,#40106c,#160b3c);
 background-size:400% 400%;animation:bg 15s ease infinite;
 overflow:hidden
}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(65px);opacity:.35;pointer-events:none;animation:float 9s infinite alternate}
.orb.one{width:250px;height:250px;background:#a855f7;top:5%;left:5%}
.orb.two{width:280px;height:280px;background:#ec4899;right:0;bottom:0;animation-delay:2s}
@keyframes float{to{transform:translate(60px,-50px) scale(1.2)}}
.app{height:100dvh;display:flex;position:relative;z-index:1}
.sidebar{
 width:270px;background:#10082199;backdrop-filter:blur(25px);
 border-right:1px solid #ffffff20;padding:18px;display:flex;flex-direction:column
}
.logo{font-size:25px;font-weight:900;letter-spacing:1px;margin:12px 0 25px}
.logo span{color:#c4a7ff}
.newchat,.history button{
 border:1px solid #ffffff25;background:#ffffff0c;color:white;
 padding:13px;border-radius:13px;text-align:left;cursor:pointer
}
.newchat:hover,.history button:hover{background:#ffffff20}
.history{margin-top:20px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.history button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebottom{margin-top:auto;color:#a99bbd;font-size:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
 height:70px;display:flex;align-items:center;justify-content:space-between;
 padding:0 24px;border-bottom:1px solid #ffffff18;
 background:#ffffff08;backdrop-filter:blur(20px)
}
.status{color:#c4a7ff;font-size:13px}
.chat{flex:1;overflow:auto;padding:28px 18px;scroll-behavior:smooth}
.welcome{text-align:center;margin:10vh auto 30px;max-width:600px}
.avatar{
 width:78px;height:78px;margin:auto;border-radius:25px;
 display:grid;place-items:center;font-size:36px;
 background:linear-gradient(135deg,#9333ea,#ec4899);
 box-shadow:0 0 45px #a855f755;animation:pulse 3s infinite
}
@keyframes pulse{50%{box-shadow:0 0 65px #c084fc99}}
.welcome h1{font-size:34px;margin:22px 0 10px}
.welcome p{color:#c4b5d8;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}
.suggestions button{
 padding:11px 15px;border-radius:30px;border:1px solid #ffffff25;
 background:#ffffff0d;color:white;cursor:pointer
}
.messages{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:20px}
.message{display:flex;gap:12px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.bubble{
 max-width:min(80%,700px);padding:15px 18px;border-radius:18px;
 background:#ffffff12;border:1px solid #ffffff20;
 backdrop-filter:blur(15px);line-height:1.65;overflow-wrap:anywhere
}
.user .bubble{background:linear-gradient(135deg,#7134c8,#963cc2);border:0}
.bubble pre{white-space:pre-wrap;overflow:auto;background:#100821;padding:12px;border-radius:10px}
.bubble code{color:#e9c8ff}
.bubble img{max-width:100%}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{
 border:0;background:#ffffff12;color:#ddd;padding:6px 10px;
 border-radius:8px;cursor:pointer
}
.composer-wrap{padding:12px 18px 20px}
.composer{
 max-width:850px;margin:auto;display:flex;align-items:flex-end;gap:10px;
 padding:12px;border-radius:22px;background:#ffffff12;
 border:1px solid #ffffff30;backdrop-filter:blur(20px);
 box-shadow:0 10px 40px #0003
}
textarea{
 flex:1;resize:none;max-height:150px;min-height:28px;
 background:transparent;border:0;outline:0;color:white;
 font:16px Arial;padding:8px
}
textarea::placeholder{color:#c0b3d2}
.action{
 width:43px;height:43px;border:0;border-radius:14px;
 background:#ffffff15;color:white;font-size:19px;cursor:pointer
}
.action.send{background:linear-gradient(135deg,#9333ea,#db45a8)}
.action:hover{filter:brightness(1.2)}
.footer{text-align:center;color:#9b8bac;font-size:11px;margin-top:10px}
.typing{color:#c4a7ff;font-size:13px}
@media(max-width:650px){
 .sidebar{width:65px;padding:10px}
 .logo{font-size:0;text-align:center}
 .logo:first-letter{font-size:24px}
 .newchat{font-size:0;text-align:center;padding:12px}
 .newchat:first-letter{font-size:20px}
 .history{display:none}
 .sidebottom{display:none}
 .topbar{padding:0 13px}
 .chat{padding:15px 10px}
 .welcome h1{font-size:27px}
 .bubble{max-width:88%}
 .composer-wrap{padding:8px}
}
</style>
</head>
<body>
<div class="orb one"></div><div class="orb two"></div>
<div class="app">
<aside class="sidebar">
 <div class="logo">⚡ ZEUS<span>GPT</span></div>
 <button class="newchat" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
 <div style="font-size:12px;color:#a99bbd;margin-top:25px">LỊCH SỬ</div>
 <div class="history" id="history"></div>
 <div class="sidebottom">ZEUSGPT AI<br>Powered by Cloudflare Workers AI</div>
</aside>

<main class="main">
 <header class="topbar">
  <strong>⚡ ZEUSGPT <span style="color:#c4a7ff">AI</span></strong>
  <span class="status">● Đang kết nối</span>
 </header>
 <section class="chat" id="chat">
  <div class="welcome" id="welcome">
   <div class="avatar">⚡</div>
   <h1>Xin chào! Tôi là ZEUSGPT</h1>
   <p>Trợ lý AI của bạn. Hãy hỏi bất cứ điều gì, mình sẽ cố gắng giúp bạn.</p>
   <div class="suggestions">
    <button onclick="suggest('Giải thích trí tuệ nhân tạo là gì')">🤖 AI là gì?</button>
    <button onclick="suggest('Giúp tôi học tiếng Anh')">📚 Học tập</button>
    <button onclick="suggest('Viết một đoạn code HTML đẹp')">💻 Viết code</button>
   </div>
  </div>
  <div class="messages" id="messages"></div>
 </section>
 <div class="composer-wrap">
  <div class="composer">
   <button class="action" id="mic" onclick="toggleMic()" title="Nói chuyện">🎙️</button>
   <textarea id="input" rows="1" placeholder="Nhập tin nhắn cho ZEUSGPT..." onkeydown="keySend(event)"></textarea>
   <button class="action" onclick="stopSpeech()" title="Dừng đọc">🔇</button>
   <button class="action send" onclick="sendMessage()" title="Gửi">➤</button>
  </div>
  <div class="footer">ZEUSGPT có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</div>
 </div>
</main>
</div>

<script>
const API_URL="https://khanggpt.itzkenmcxd.workers.dev";
const input=document.getElementById("input");
const messagesEl=document.getElementById("messages");
const welcome=document.getElementById("welcome");
let messages=[];
let chats=JSON.parse(localStorage.getItem("zeus_chats")||"[]");
let recognition=null;
let listening=false;
let voiceTranscript="";

function saveChats(){
 localStorage.setItem("zeus_chats",JSON.stringify(chats));
 renderHistory();
}
function renderHistory(){
 const box=document.getElementById("history");
 box.innerHTML="";
 chats.forEach((c,i)=>{
  const b=document.createElement("button");
  b.textContent="💬 "+c.title;
  b.onclick=()=>loadChat(i);
  box.appendChild(b);
 });
}
function newChat(){
 messages=[];messagesEl.innerHTML="";
 welcome.style.display="block";
 input.value="";
}
function loadChat(i){
 messages=chats[i].messages.map(m=>({...m}));
 welcome.style.display="none";
 messagesEl.innerHTML="";
 messages.forEach(m=>addMessage(m.role,m.content,false));
}
function suggest(text){input.value=text;sendMessage()}
function keySend(e){
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
}
function addMessage(role,content,save=true){
 welcome.style.display="none";
 const wrap=document.createElement("div");
 wrap.className="message "+(role==="user"?"user":"assistant");
 const icon=document.createElement("div");
 icon.textContent=role==="user"?"👤":"⚡";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 if(role==="assistant"){
  bubble.innerHTML=DOMPurify.sanitize(marked.parse(content||""));
 }else{
  bubble.textContent=content;
 }
 wrap.append(icon,bubble);
 if(role==="assistant"){
  const tools=document.createElement("div");tools.className="tools";
  const copy=document.createElement("button");copy.textContent="📋 Sao chép";
  copy.onclick=()=>navigator.clipboard.writeText(content);
  const speak=document.createElement("button");speak.textContent="🔊 Đọc";
  speak.onclick=()=>speakText(content);
  tools.append(copy,speak);bubble.append(tools);
 }
 messagesEl.appendChild(wrap);
 document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
 if(save){
  messages.push({role,content});
  chats[0]={title:messages.find(m=>m.role==="user")?.content.slice(0,35)||"Cuộc trò chuyện mới",messages};
  saveChats();
 }
 return bubble;
}
async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 stopSpeech();
 addMessage("user",text);
 const loading=addMessage("assistant","Đang suy nghĩ...");
 loading.innerHTML='<span class="typing">⚡ ZEUSGPT đang suy nghĩ...</span>';
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({app:"ZEUSGPT",messages:[
    {role:"system",content:"Bạn là ZEUSGPT, trợ lý AI thân thiện. Trả lời bằng tiếng Việt khi phù hợp, rõ ràng và hữu ích."},
    ...messages.slice(0,-1).slice(-20),
    {role:"user",content:text}
   ]})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||data.message||"HTTP "+response.status);
  const answer=data.choices?.[0]?.message?.content??data.response??data.result??data.output??"";
  if(!answer)throw new Error("AI không trả về nội dung.");
  loading.innerHTML=DOMPurify.sanitize(marked.parse(answer));
  messages.push({role:"assistant",content:answer});
  chats[0]={title:messages.find(m=>m.role==="user")?.content.slice(0,35)||"Cuộc trò chuyện mới",messages};
  saveChats();
  speakText(answer);
 }catch(err){
  loading.textContent="⚠️ ZEUSGPT gặp lỗi: "+err.message;
 }
}
function speakText(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utter=new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g," đoạn mã "));
 utter.lang="vi-VN";utter.rate=1;utter.pitch=1;
 const voices=speechSynthesis.getVoices();
 const vi=voices.find(v=>v.lang.toLowerCase().startsWith("vi"));
 if(vi)utter.voice=vi;
 speechSynthesis.speak(utter);
}
function stopSpeech(){if("speechSynthesis" in window)speechSynthesis.cancel()}
function toggleMic(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert("Trình duyệt chưa hỗ trợ micro. Hãy thử Chrome mới nhất.");
  return;
 }
 if(listening){recognition.stop();return}
 recognition=new SpeechRecognition();
 recognition.lang="vi-VN";
 recognition.continuous=false;
 recognition.interimResults=true;
 voiceTranscript="";
 recognition.onstart=()=>{
  listening=true;
  document.getElementById("mic").textContent="🔴";
 };
 recognition.onresult=e=>{
  voiceTranscript="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   voiceTranscript+=e.results[i][0].transcript;
  }
  input.value=voiceTranscript;
 };
 recognition.onerror=()=>{
  listening=false;
  document.getElementById("mic").textContent="🎙️";
 };
 recognition.onend=()=>{
  listening=false;
  document.getElementById("mic").textContent="🎙️";
  if(voiceTranscript.trim())sendMessage();
 };
 recognition.start();
}
renderHistory();
</script>
</body>
</html>
