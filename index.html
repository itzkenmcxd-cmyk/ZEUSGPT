<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUSGPT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --bg:#090914;
  --panel:#11111f;
  --panel2:#19192b;
  --text:#f5f3ff;
  --muted:#9996b5;
  --purple:#8757ff;
  --blue:#397dff;
  --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  height:100vh;overflow:hidden;
}
button,textarea{font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{
  width:265px;background:#0e0e1a;border-right:1px solid var(--border);
  padding:18px;display:flex;flex-direction:column;gap:15px;
}
.logo{
  font-size:24px;font-weight:800;
  background:linear-gradient(90deg,#a875ff,#43a5ff);
  -webkit-background-clip:text;color:transparent;
}
.new-chat,.side-button{
  border:1px solid var(--border);background:var(--panel2);
  color:white;border-radius:12px;padding:12px;text-align:left;
  cursor:pointer;font-size:14px;
}
.new-chat:hover,.side-button:hover{background:#25243d}
.history-title{font-size:12px;color:var(--muted);margin-top:12px}
.history{overflow:auto;flex:1}
.history-item{
  padding:11px;border-radius:9px;font-size:13px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#c9c5dc;
}
.history-item:hover,.history-item.active{background:#22213a}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:62px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:rgba(15,15,28,.8);
}
.top-title{font-weight:700}
.model-label{font-size:12px;color:#aaa5c8}
.chat-area{
  flex:1;overflow-y:auto;padding:30px 18px;
  scroll-behavior:smooth;
}
.messages{max-width:850px;margin:auto}
.welcome{text-align:center;margin:12vh auto 40px}
.welcome h1{
  font-size:36px;font-weight:800;
  background:linear-gradient(90deg,#a875ff,#48a8ff);
  -webkit-background-clip:text;color:transparent;
}
.welcome p{color:var(--muted)}
.message{display:flex;gap:13px;margin:25px 0;align-items:flex-start}
.avatar{
  width:34px;height:34px;flex-shrink:0;border-radius:11px;
  display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,#8757ff,#397dff);
}
.user-avatar{background:#29283e}
.content{min-width:0;flex:1;line-height:1.8;font-size:15px}
.content p{margin:5px 0 14px}
.content h1,.content h2,.content h3{margin:22px 0 10px;line-height:1.35}
.content h1{font-size:25px}
.content h2{font-size:21px}
.content h3{font-size:18px}
.content ul,.content ol{padding-left:25px}
.content li{margin:5px 0}
.content blockquote{
  border-left:3px solid var(--purple);margin:15px 0;
  padding:8px 15px;background:#171629;color:#c7c1e2;
}
.content table{border-collapse:collapse;width:100%;margin:15px 0;font-size:14px}
.content th,.content td{border:1px solid var(--border);padding:10px;text-align:left}
.content th{background:#24213c}
.content a{color:#8caeff}
.content code{
  background:#25243a;padding:3px 6px;border-radius:5px;
  font-family:Consolas,monospace;font-size:.9em;
}
.code-wrap{
  background:#10101b;border:1px solid var(--border);
  border-radius:12px;margin:15px 0;overflow:hidden;
}
.code-head{
  padding:9px 13px;background:#1a192a;
  display:flex;justify-content:space-between;
  color:#aaa5c8;font-size:12px;
}
.code-head button,.action-btn{
  background:transparent;color:#b9b4d0;
  border:0;cursor:pointer;padding:5px 8px;border-radius:6px;
}
.code-head button:hover,.action-btn:hover{background:#33304c;color:white}
.content pre{margin:0;padding:16px;overflow:auto}
.content pre code{background:none;padding:0;line-height:1.65}
.actions{display:flex;gap:6px;margin-top:10px}
.input-area{
  padding:15px 18px 20px;
  background:linear-gradient(transparent,#0b0b17 30%);
}
.input-box{
  max-width:850px;margin:auto;border:1px solid #37324f;
  border-radius:17px;background:#171626;padding:12px;
  box-shadow:0 5px 35px #0005;
}
textarea{
  display:block;width:100%;resize:none;max-height:180px;
  border:0;outline:0;background:transparent;color:white;
  font-size:15px;line-height:1.6;padding:5px 7px;
}
.input-bottom{display:flex;justify-content:space-between;align-items:center}
.input-hint{font-size:11px;color:#817d9d}
.send-btn{
  border:0;border-radius:11px;padding:10px 17px;color:white;
  font-weight:700;cursor:pointer;
  background:linear-gradient(110deg,#8757ff,#397dff);
}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.typing{color:var(--muted);font-size:14px}
@media(max-width:700px){
 .sidebar{display:none}
 .topbar{padding:0 15px}
 .chat-area{padding:18px 12px}
 .welcome h1{font-size:29px}
 .content{font-size:14px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="logo">✦ ZEUSGPT</div>
  <button class="new-chat" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
  <div class="history-title">LỊCH SỬ TRÒ CHUYỆN</div>
  <div class="history" id="history"></div>
  <div class="sidebar-bottom">
    <button class="side-button" style="width:100%" onclick="clearHistory()">⌫ Xóa lịch sử</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="top-title">ZEUSGPT <span class="model-label">· AI Assistant</span></div>
    <div class="model-label">⚡ Ultra</div>
  </header>

  <section class="chat-area" id="chatArea">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>Chào mừng đến ZEUSGPT</h1>
        <p>Trợ lý AI của bạn. Hôm nay mình có thể giúp gì?</p>
      </div>
    </div>
  </section>

  <footer class="input-area">
    <div class="input-box">
      <textarea id="prompt" rows="1" placeholder="Nhắn tin cho ZEUSGPT..."></textarea>
      <div class="input-bottom">
        <span class="input-hint">ZEUSGPT có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</span>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Gửi ↑</button>
      </div>
    </div>
  </footer>
</main>
</div>

<script>
const API_URL = "https://khanggpt.itzkenmcxd.workers.dev";

let conversations = JSON.parse(localStorage.getItem("zeus_history") || "[]");
let currentId = null;
let messages = [];
let busy = false;

const promptBox = document.getElementById("prompt");
const messageBox = document.getElementById("messages");
const chatArea = document.getElementById("chatArea");

marked.setOptions({ breaks:true, gfm:true });

function saveHistory(){
  localStorage.setItem("zeus_history",JSON.stringify(conversations));
  renderHistory();
}

function renderHistory(){
  const box=document.getElementById("history");
  box.innerHTML="";
  conversations.slice().reverse().forEach(c=>{
    const item=document.createElement("div");
    item.className="history-item";
    item.textContent=c.title;
    item.onclick=()=>loadChat(c.id);
    box.appendChild(item);
  });
}

function newChat(){
  currentId=null;
  messages=[];
  messageBox.innerHTML=`
    <div class="welcome" id="welcome">
      <h1>Chào mừng đến ZEUSGPT</h1>
      <p>Trợ lý AI của bạn. Hôm nay mình có thể giúp gì?</p>
    </div>`;
  promptBox.focus();
}

function loadChat(id){
  const c=conversations.find(x=>x.id===id);
  if(!c)return;
  currentId=id;
  messages=c.messages;
  messageBox.innerHTML="";
  messages.forEach((m,i)=>addMessage(m.role,m.content,i===messages.length-1&&m.role==="assistant"));
  chatArea.scrollTop=chatArea.scrollHeight;
}

function clearHistory(){
  if(!confirm("Bạn có muốn xóa toàn bộ lịch sử không?"))return;
  conversations=[];
  saveHistory();
  newChat();
}

function addMessage(role,text,withActions=false){
  document.getElementById("welcome")?.remove();

  const row=document.createElement("div");
  row.className="message";

  const avatar=document.createElement("div");
  avatar.className="avatar "+(role==="user"?"user-avatar":"");
  avatar.textContent=role==="user"?"B":"Z";

  const body=document.createElement("div");
  body.className="content";

  if(role==="user"){
    body.textContent=text;
  }else{
    body.innerHTML=renderMarkdown(text);
  }

  row.append(avatar,body);
  messageBox.appendChild(row);

  if(role==="assistant" && withActions){
    const actions=document.createElement("div");
    actions.className="actions";

    const copy=document.createElement("button");
    copy.className="action-btn";
    copy.textContent="▢ Sao chép";
    copy.onclick=()=>copyText(text,copy);

    const retry=document.createElement("button");
    retry.className="action-btn";
    retry.textContent="↻ Tạo lại";
    retry.onclick=regenerate;

    actions.append(copy,retry);
    body.appendChild(actions);
  }

  chatArea.scrollTop=chatArea.scrollHeight;
}

function renderMarkdown(text){
  const html=marked.parse(text||"");
  const safe=DOMPurify.sanitize(html);
  const temp=document.createElement("div");
  temp.innerHTML=safe;

  temp.querySelectorAll("pre").forEach(pre=>{
    const code=pre.querySelector("code");
    const language=code?.className?.replace("language-","")||"Code";
    const wrap=document.createElement("div");
    wrap.className="code-wrap";

    const head=document.createElement("div");
    head.className="code-head";

    const label=document.createElement("span");
    label.textContent=language;

    const btn=document.createElement("button");
    btn.textContent="Sao chép code";
    btn.onclick=()=>copyText(code?.innerText||"",btn);

    head.append(label,btn);
    pre.parentNode.insertBefore(wrap,pre);
    wrap.append(head,pre);
  });

  return temp.innerHTML;
}

async function copyText(text,button){
  try{
    await navigator.clipboard.writeText(text);
    const old=button.textContent;
    button.textContent="Đã sao chép ✓";
    setTimeout(()=>button.textContent=old,1500);
  }catch{
    alert("Không thể sao chép. Hãy thử lại.");
  }
}

function saveConversation(){
  if(!messages.length)return;
  if(!currentId)currentId=Date.now().toString();

  let c=conversations.find(x=>x.id===currentId);
  const title=messages.find(m=>m.role==="user")?.content.slice(0,45)||"Cuộc trò chuyện mới";

  if(!c){
    c={id:currentId,title,messages};
    conversations.push(c);
  }else{
    c.messages=messages;
    c.title=title;
  }
  saveHistory();
}

async function sendMessage(){
  const text=promptBox.value.trim();
  if(!text||busy)return;

  busy=true;
  document.getElementById("sendBtn").disabled=true;
  promptBox.value="";
  promptBox.style.height="auto";

  messages.push({role:"user",content:text});
  addMessage("user",text);

  const loading=document.createElement("div");
  loading.className="message";
  loading.innerHTML='<div class="avatar">Z</div><div class="content typing">ZEUSGPT đang suy nghĩ...</div>';
  messageBox.appendChild(loading);
  chatArea.scrollTop=chatArea.scrollHeight;

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        app:"ZEUSGPT",
        messages:messages
      })
    });

    const data=await response.json();
    if(!response.ok)throw new Error(data.error?.message||data.error||"HTTP "+response.status);

    const answer=
      data.choices?.[0]?.message?.content ??
      data.response ??
      data.result ??
      data.output ??
      data.content ??
      "";

    if(!answer)throw new Error("AI không trả về nội dung.");

    loading.remove();
    messages.push({role:"assistant",content:answer});
    addMessage("assistant",answer,true);
    saveConversation();

  }catch(error){
    loading.remove();
    addMessage("assistant","⚠️ Lỗi: "+error.message);
  }

  busy=false;
  document.getElementById("sendBtn").disabled=false;
  promptBox.focus();
}

async function regenerate(){
  if(busy||messages.length<2)return;
  if(messages[messages.length-1].role==="assistant")messages.pop();
  const lastUser=messages[messages.length-1];
  if(!lastUser||lastUser.role!=="user")return;

  messageBox.innerHTML="";
  messages.forEach(m=>addMessage(m.role,m.content));
  promptBox.value=lastUser.content;
  await sendMessage();
}

promptBox.addEventListener("input",()=>{
  promptBox.style.height="auto";
  promptBox.style.height=Math.min(promptBox.scrollHeight,180)+"px";
});

promptBox.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

renderHistory();
</script>
</body>
</html>
