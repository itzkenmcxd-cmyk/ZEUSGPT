<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUSGPT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0718;color:#fff;font-family:Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 20% 20%,#512080 0,transparent 35%),radial-gradient(circle at 85% 80%,#172d63 0,transparent 35%)}
.app{display:flex;height:100vh;padding:14px;gap:14px}
.sidebar,.main{background:#17112bd9;border:1px solid #ffffff20;backdrop-filter:blur(20px);border-radius:20px}
.sidebar{width:260px;padding:16px;display:flex;flex-direction:column}
.logo{font-size:23px;font-weight:bold;padding:12px 0 25px;color:#d8b4fe}
button{cursor:pointer;color:white}
.new{background:linear-gradient(120deg,#7c3aed,#c026d3);border:0;padding:13px;border-radius:12px;font-weight:bold}
.history{flex:1;overflow:auto;margin-top:15px}
.hist{padding:11px;border-radius:10px;color:#c4b5fd;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hist:hover{background:#ffffff15}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{padding:19px 22px;border-bottom:1px solid #ffffff20;font-weight:bold;display:flex;justify-content:space-between}
.chat{flex:1;overflow:auto;padding:25px max(15px,calc((100% - 850px)/2))}
.welcome{text-align:center;margin:auto;max-width:600px;padding-top:15vh}
.welcome h1{font-size:38px;background:linear-gradient(90deg,#fff,#c084fc,#67e8f9);background-clip:text;color:transparent}
.welcome p{color:#b9acd2;line-height:1.6}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}
.suggestions button{background:#ffffff0d;border:1px solid #ffffff20;padding:15px;border-radius:12px;text-align:left}
.message{display:flex;gap:12px;margin:0 auto 20px;max-width:850px}
.avatar{width:35px;height:35px;flex-shrink:0;background:#7c3aed;border-radius:11px;display:grid;place-items:center}
.bubble{background:#ffffff10;border:1px solid #ffffff15;padding:13px 16px;border-radius:4px 15px 15px 15px;line-height:1.7;overflow-wrap:anywhere}
.user{flex-direction:row-reverse}
.user .bubble{background:linear-gradient(120deg,#7040c5,#a855f7);border:0;border-radius:15px 4px 15px 15px}
.bubble pre{background:#080612;padding:12px;border-radius:10px;overflow:auto}
.composer-wrap{padding:14px;border-top:1px solid #ffffff20}
.composer{max-width:900px;margin:auto;background:#100b20;border:1px solid #a78bfa66;border-radius:17px;padding:10px}
textarea{width:100%;background:transparent;color:white;border:0;outline:0;resize:none;padding:10px;font:inherit;min-height:48px;max-height:150px}
.actions{display:flex;justify-content:space-between;align-items:center}
.actions button{background:#ffffff12;border:1px solid #ffffff20;border-radius:10px;padding:10px 13px}
.actions .send{background:linear-gradient(120deg,#7c3aed,#c026d3);border:0}
footer{text-align:center;color:#827594;font-size:11px;padding-top:8px}
@media(max-width:700px){.app{padding:6px}.sidebar{display:none}.main{border-radius:15px}.chat{padding:15px}.welcome h1{font-size:29px}.suggestions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">⚡ ZEUSGPT</div>
<button class="new" id="newChat">＋ Cuộc trò chuyện mới</button>
<div class="history" id="history"></div>
<button id="clear" style="background:#ffffff10;border:1px solid #ffffff20;padding:11px;border-radius:10px">Xóa lịch sử</button>
</aside>
<main class="main">
<header>ZEUSGPT <span style="color:#86efac;font-size:12px">● Sẵn sàng</span></header>
<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div style="font-size:48px">⚡</div>
<h1>Xin chào! Tôi là ZEUSGPT</h1>
<p>Trợ lý AI của bạn. Hãy đặt câu hỏi, học tập, sáng tạo hoặc cùng tôi giải quyết vấn đề.</p>
<div class="suggestions">
<button>✦ Giải thích một kiến thức khó hiểu</button>
<button>✦ Viết một đoạn văn thật hay</button>
<button>✦ Lên ý tưởng cho website</button>
<button>✦ Giúp tôi học tiếng Anh</button>
</div>
</div>
</section>
<div class="composer-wrap">
<div class="composer">
<textarea id="prompt" placeholder="Nhắn tin cho ZEUSGPT..."></textarea>
<div class="actions">
<span style="font-size:11px;color:#9285aa">Enter để gửi · Shift + Enter xuống dòng</span>
<div>
<button id="mic">🎙</button>
<button id="speak">🔊</button>
<button class="send" id="send">➤</button>
</div>
</div>
</div>
<footer>ZEUSGPT có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</footer>
</div>
</main>
</div>
<script>
const API_URL="https://khanggpt.itzkenmcxd.workers.dev";
const KEY="zeusgpt_chats";
let chats=JSON.parse(localStorage.getItem(KEY)||"[]"),messages=[],current=null,busy=false,autoSpeak=false,voiceOn=true;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(chats));renderHistory()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function format(s){return escapeHTML(s).replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}
function renderHistory(){const h=$("history");h.innerHTML="";chats.slice().sort((a,b)=>b.time-a.time).forEach(c=>{let d=document.createElement("div");d.className="hist";d.textContent=c.title;d.onclick=()=>openChat(c.id);h.appendChild(d)})}
function render(){let area=$("chat");area.innerHTML="";if(!messages.length){area.innerHTML=$("welcome").outerHTML;area.querySelectorAll(".suggestions button").forEach(b=>b.onclick=()=>{$("prompt").value=b.textContent.replace(/^✦\s*/,"");send()});return}messages.forEach(m=>{let d=document.createElement("div");d.className="message "+(m.role==="user"?"user":"");d.innerHTML='<div class="avatar">'+(m.role==="user"?"Bạn":"⚡")+'</div><div class="bubble">'+format(m.content)+'</div>';area.appendChild(d)});area.scrollTop=area.scrollHeight}
function persist(){let c=chats.find(x=>x.id===current);if(!c){c={id:current,title:messages.find(x=>x.role==="user")?.content.slice(0,35)||"Cuộc trò chuyện mới",time:Date.now(),messages:[]};chats.push(c)}c.messages=messages;c.time=Date.now();save()}
function openChat(id){let c=chats.find(x=>x.id===id);if(!c)return;current=id;messages=c.messages||[];render()}
function newChat(){current=null;messages=[];render()}
async function send(){if(busy)return;let text=$("prompt").value.trim();if(!text)return;$("prompt").value="";if(!current)current=Date.now().toString(36);messages.push({role:"user",content:text});render();busy=true;$("send").disabled=true;let wait=document.createElement("div");wait.className="message";wait.id="waiting";wait.innerHTML='<div class="avatar">⚡</div><div class="bubble">Đang suy nghĩ...</div>';$("chat").appendChild(wait);
try{
let res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app:"ZEUSGPT",messages:[{role:"system",content:"Bạn là ZEUSGPT, trợ lý AI hữu ích. Trả lời bằng tiếng Việt khi phù hợp."},...messages.slice(-30)]})});
let raw=await res.text(),data;try{data=JSON.parse(raw)}catch{data=raw}
if(!res.ok)throw Error(data?.error?.message||data?.error||data?.message||raw||"HTTP "+res.status);
let answer=typeof data==="string"?data:(data?.choices?.[0]?.message?.content??data?.result?.response??data?.response??data?.output_text??data?.message?.content??data?.content??data?.text??"");
if(!answer)throw Error("Worker không trả về nội dung văn bản");
messages.push({role:"assistant",content:String(answer)});persist();render();if(autoSpeak&&voiceOn)speak(answer)
}catch(e){messages.pop();render();alert("Lỗi: "+e.message)}
finally{busy=false;$("send").disabled=false}
}
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";speechSynthesis.speak(u)}
$("send").onclick=send;$("newChat").onclick=newChat;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("prompt").addEventListener("input",e=>{e.target.style.height="48px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
$("clear").onclick=()=>{if(confirm("Xóa toàn bộ lịch sử chat?")){chats=[];save();newChat()}};
$("mic").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Hãy dùng Chrome để sử dụng micro");return}let r=new SR();r.lang="vi-VN";r.onresult=e=>$("prompt").value+=e.results[0][0].transcript;r.onerror=()=>alert("Không truy cập được micro");r.start()};
$("speak").onclick=()=>{voiceOn=!voiceOn;$("speak").style.background=voiceOn?"#ffffff12":"#7c3aed";if(!voiceOn)speechSynthesis.cancel()};
renderHistory();render();
</script>
</body>
</html>
